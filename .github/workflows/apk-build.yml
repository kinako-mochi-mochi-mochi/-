name: APK Build
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in build/outputs/apk/debug/"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}-$(date +%s)"
          gh release create "$TAG" ${{ steps.find-apk.outputs.apk_path }} \
            --title "APK Build #${{ github.run_number }}" \
            --notes "Debug APK built from branch ${{ inputs.branch }}" \
            --target ${{ inputs.branch }}
          echo "tag=$TAG" >> $GITHUB_ENV
